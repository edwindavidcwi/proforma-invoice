<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Quiz Quest</title><style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(160deg,#0e2838,#071620);
  font-family:"Segoe UI Rounded","SF Pro Rounded","Comic Sans MS",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;color:#26303a}
#qq{width:min(96vw,460px)}
#topbar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:16px 16px 0 0;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff}
#topbar .logo{font-weight:800;font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
#topbar .grow{flex:1}
#topbar .tb{background:rgba(255,255,255,.22);border:0;color:#fff;border-radius:10px;
  padding:8px 11px;font:700 13px/1 inherit;cursor:pointer}
#topbar .tb.off{opacity:.5;text-decoration:line-through}
#stage{position:relative;background:#0b1418;line-height:0;overflow:hidden}
#cv{display:block;width:100%;height:auto;image-rendering:pixelated;background:#cde4b0}
#overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;
  pointer-events:none;padding:10px}
#overlay .box{pointer-events:auto;width:100%;background:#fffdf8;border-radius:16px;
  padding:13px 15px;box-shadow:0 8px 26px rgba(0,0,0,.45);animation:pop .15s ease}
@keyframes pop{from{transform:translateY(10px);opacity:.6}to{transform:none;opacity:1}}
.box p{margin:0 0 10px;font-size:17px;line-height:1.4;font-weight:700;color:#26303a}
.box p.q{font-size:18px}
.clk{display:inline-block;background:#e0f2f1;color:#0d9488;border-radius:8px;padding:1px 8px;font-size:13px}
.hint{margin:8px 0 0!important;font-size:14px!important;font-weight:600!important;color:#b4690e!important}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{flex:1 1 auto;min-height:48px;border:3px solid #e7e0cf;background:#fff;border-radius:13px;
  padding:10px 12px;font:800 16px/1.1 inherit;color:#26303a;cursor:pointer;transition:transform .06s}
.opt:active{transform:scale(.96)}
.opt.ans{border-color:#cdd7e3}
.opt small{display:block;font-size:11px;font-weight:600;color:#7c6f55;margin-top:3px}
.opt.next,.opt.msgbtn{background:linear-gradient(180deg,#5be39a,#16a34a);color:#04261a;border:0}
#pad{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 18px;
  background:#0e2838;border-radius:0 0 16px 16px}
.dpad{position:relative;width:132px;height:132px}
.dpad .d{position:absolute;width:44px;height:44px;border:0;border-radius:10px;background:#33506f;color:#cfe2ee;font-size:16px;cursor:pointer}
.dpad .u{left:44px;top:0}.dpad .dn{left:44px;top:88px}.dpad .l{left:0;top:44px}.dpad .r{left:88px;top:44px}
.dpad .d:active{background:#22405a}
.ab{display:flex;gap:14px}
.rb{width:62px;height:62px;border-radius:50%;border:0;font:800 22px/1 inherit;color:#fff;cursor:pointer;
  background:linear-gradient(180deg,#ff7a59,#e23b3b);box-shadow:0 4px 0 #a52121}
.rb.b{background:linear-gradient(180deg,#7aa0ff,#3b5be2);box-shadow:0 4px 0 #21307f}
.rb:active{transform:translateY(3px);box-shadow:none}
</style></head><body>

/* ===== core/engine.js ===== */
// =============================================================================
// Quiz Quest v2 -- LOGIC CORE (pure, deterministic, no DOM/canvas).
// The same module powers the playable game (browser) and the audit harness
// (Node). All randomness flows through a seedable RNG stored in the state, so
// every playthrough is reproducible from its seed. step(state, input) is the
// single entry point; it mutates+returns the state and a list of events.
//
// Content (creatures, world, names) is ORIGINAL -- faithful in *mechanics* to
// the classic monster-RPG, but our own world ("Sunny Town", "Sprigling", ...).
// =============================================================================

// ---- seedable RNG (mulberry32): state.seed is a uint32 we advance ----------
function nextRand(state) {
  let t = (state.seed = (state.seed + 0x6D2B79F5) >>> 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function randInt(state, n) { return Math.floor(nextRand(state) * n); }

// ---- elemental type chart (generic elements; not copyrighted) --------------
const TYPES = ["Normal", "Leaf", "Flame", "Aqua", "Spark", "Stone"];
// multiplier of attacker-type vs defender-type (2 = strong, 0.5 = weak)
const STRONG = { Flame: "Leaf", Leaf: "Aqua", Aqua: "Flame", Spark: "Aqua", Stone: "Flame" };
const WEAK = { Flame: "Aqua", Leaf: "Flame", Aqua: "Leaf", Spark: "Stone", Stone: "Aqua" };
function typeMult(atk, def) {
  if (STRONG[atk] === def) return 2;
  if (WEAK[atk] === def) return 0.5;
  return 1;
}

// ---- moves -----------------------------------------------------------------
const MOVES = {
  Tackle: { name: "Tackle", type: "Normal", power: 7 },
  Leafcut: { name: "Leafcut", type: "Leaf", power: 9 },
  Ember: { name: "Ember", type: "Flame", power: 9 },
  Bubble: { name: "Bubble", type: "Aqua", power: 9 },
  Zap: { name: "Zap", type: "Spark", power: 9 },
  Pebble: { name: "Pebble", type: "Stone", power: 9 },
};

// ---- creatures (original) --------------------------------------------------
// hp/atk/def are simple flat stats for the slice; levels scale them lightly.
const SPECIES = {
  Sprigling: { name: "Sprigling", type: "Leaf",  hp: 22, atk: 7, def: 6, moves: ["Tackle", "Leafcut"], color: "#3fb96b" },
  Flarepup:  { name: "Flarepup",  type: "Flame", hp: 21, atk: 8, def: 5, moves: ["Tackle", "Ember"],   color: "#f0663a" },
  Dripling:  { name: "Dripling",  type: "Aqua",  hp: 23, atk: 7, def: 6, moves: ["Tackle", "Bubble"],  color: "#3a9bf0" },
  Sparkit:   { name: "Sparkit",   type: "Spark", hp: 18, atk: 7, def: 5, moves: ["Tackle", "Zap"],     color: "#f0c64a" },
  Pebbo:     { name: "Pebbo",     type: "Stone", hp: 24, atk: 6, def: 8, moves: ["Tackle", "Pebble"],  color: "#b08a5a" },
  Buggle:    { name: "Buggle",    type: "Leaf",  hp: 17, atk: 6, def: 5, moves: ["Tackle"],            color: "#9bbf3a" },
};
const STARTERS = ["Sprigling", "Flarepup", "Dripling"];
const WILD = ["Sparkit", "Pebbo", "Buggle"];

function makeMon(state, species, level) {
  const s = SPECIES[species];
  const lv = level || 5;
  const maxHp = s.hp + (lv - 5) * 3;
  return { species, name: s.name, type: s.type, level: lv,
    maxHp, hp: maxHp, atk: s.atk + (lv - 5), def: s.def + ((lv - 5) >> 1), moves: s.moves.slice() };
}

// ---- world map (single grid for the slice) ---------------------------------
// Legend: . path  , grass(tall=encounters)  # wall/tree  ~ water  P professor
//         G goal sign  S start  H house
const MAP_ROWS = [
  "##########",
  "#..H...P.#",
  "#..S.....#",
  "#........#",
  "#.,,,,,,.#",
  "#.,,,,,,.#",
  "#.,,,,,,.#",
  "#.,,,,,,.#",
  "#...G....#",
  "##########",
];
const MAP = { w: 10, h: 10, rows: MAP_ROWS };
function tileAt(x, y) {
  if (y < 0 || y >= MAP.h || x < 0 || x >= MAP.w) return "#";
  return MAP.rows[y][x];
}
function isWall(x, y) { const t = tileAt(x, y); return t === "#" || t === "~" || t === "H"; }
function isProfessor(x, y) { return tileAt(x, y) === "P"; }
function isGrass(x, y) { return tileAt(x, y) === ","; }
function isGoal(x, y) { return tileAt(x, y) === "G"; }
function startPos() {
  for (let y = 0; y < MAP.h; y++) { const x = MAP.rows[y].indexOf("S"); if (x >= 0) return { x, y }; }
  return { x: 1, y: 1 };
}

// ---- new game --------------------------------------------------------------
function newGame(seed) {
  const sp = startPos();
  return {
    seed: (seed >>> 0) || 1,
    mode: "overworld",              // overworld | dialog | battle
    x: sp.x, y: sp.y, facing: "down",
    party: [],                      // creatures
    flags: { hasStarter: false },
    badges: 0,
    battlesWon: 0,
    sliceComplete: false,
    quiz: { streak: 0, missRun: 0, lastSubject: -1 },
    dialog: null,                   // { lines:[...], idx, effect }
    battle: null,                   // see startBattle
    steps: 0,
  };
}

// ---- quiz selection + checking ---------------------------------------------
function gradeFor(state) {
  let g = Math.min(5, ((state.badges >> 1) + 1));
  if (state.quiz.streak >= 4) g = Math.min(5, g + 1);
  else if (state.quiz.missRun >= 3) g = Math.max(1, g - 1);
  return g;
}
function pickQuestion(state) {
  const g = gradeFor(state);
  // candidates at this grade; avoid repeating the previous subject when possible
  let pool = QUESTIONS.filter(q => q.grade === g);
  if (!pool.length) pool = QUESTIONS;
  for (let tries = 0; tries < 16; tries++) {
    const q = pool[randInt(state, pool.length)];
    if (q.subjectId === undefined) q.subjectId = q.subject; // stable
    if (q.subject !== state.quiz.lastSubject || tries > 8) {
      state.quiz.lastSubject = q.subject;
      return buildAsked(state, q);
    }
  }
  return buildAsked(state, pool[0]);
}
function buildAsked(state, q) {
  // shuffle answer order deterministically; remember where the correct one is
  const opts = q.answers.slice();
  for (let i = opts.length - 1; i > 0; i--) { const j = randInt(state, i + 1); const t = opts[i]; opts[i] = opts[j]; opts[j] = t; }
  return { text: q.text, options: opts, correctText: q.correct,
    correct: opts.indexOf(q.correct), hint: q.hint, clock: q.clock,
    grade: q.grade, subject: q.subject, attempts: 0 };
}
function checkAnswer(asked, index) { return index === asked.correct; }

// ---- battle ----------------------------------------------------------------
function wildEncounter(state) {
  const species = WILD[randInt(state, WILD.length)];
  const level = 4 + randInt(state, 3);
  return makeMon(state, species, level);
}
function startBattle(state, enemy) {
  state.mode = "battle";
  state.battle = {
    enemy, phase: "intro", // intro | menu | quiz | resolve | done
    asked: null, pendingMove: null, log: [], result: null,
  };
}
function activeMon(state) { return state.party.find(m => m.hp > 0) || state.party[0]; }
function dealDamage(attacker, defender, move, mult) {
  const base = move.power + attacker.atk - Math.floor(defender.def / 2);
  let dmg = Math.max(1, Math.round(base * mult));
  defender.hp = Math.max(0, defender.hp - dmg);
  return dmg;
}
function enemyTurn(state) {
  const b = state.battle, me = activeMon(state);
  if (me.hp <= 0) return;
  const mv = MOVES[b.enemy.moves[randInt(state, b.enemy.moves.length)]];
  const mult = typeMult(mv.type, me.type);
  const dmg = dealDamage(b.enemy, me, mv, mult);
  b.log.push(`Enemy ${b.enemy.name} used ${mv.name}! (-${dmg})`);
}
function afterTurns(state, events) {
  const b = state.battle, me = activeMon(state);
  if (b.enemy.hp <= 0) {
    state.battlesWon++;
    state.quiz.streak++; // a clean win nudges difficulty up over time
    b.phase = "done"; b.result = "win"; b.log.push(`${b.enemy.name} fainted! You win!`);
    events.push({ t: "win" });
  } else if (me.hp <= 0) {
    b.phase = "done"; b.result = "lose"; b.log.push(`${me.name} fainted...`);
    events.push({ t: "lose" });
  } else {
    b.phase = "menu";
  }
}
function endBattle(state) {
  const b = state.battle;
  // kid-friendly: full heal after every battle, win or lose; no penalty.
  for (const m of state.party) m.hp = m.maxHp;
  if (b.result === "lose") { const sp = startPos(); state.x = sp.x; state.y = sp.y; }
  if (state.flags.hasStarter && state.battlesWon >= 1) state.sliceComplete = true;
  state.mode = "overworld"; state.battle = null;
}

// ---- dialog ----------------------------------------------------------------
function openDialog(state, lines, effect) { state.mode = "dialog"; state.dialog = { lines, idx: 0, effect: effect || null }; }

// =============================================================================
// step(state, input) -> { state, events }   -- the single reducer
// input: {type:'move',dir} | {type:'interact'} | {type:'confirm'} |
//        {type:'answer',index} | {type:'run'} | {type:'fight'} | {type:'starter',index}
// =============================================================================
function step(state, input) {
  const events = [];
  state.steps++;
  try {
    if (state.mode === "overworld") stepOverworld(state, input, events);
    else if (state.mode === "dialog") stepDialog(state, input, events);
    else if (state.mode === "battle") stepBattle(state, input, events);
  } catch (e) {
    events.push({ t: "error", msg: String(e && e.message || e) });
    throw e; // the harness records the seed; the game's outer guard catches it
  }
  return { state, events };
}

const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
function stepOverworld(state, input, events) {
  if (input.type === "move") {
    state.facing = input.dir;
    const [dx, dy] = DIRS[input.dir];
    const nx = state.x + dx, ny = state.y + dy;
    if (isWall(nx, ny) || isProfessor(nx, ny)) return; // blocked
    state.x = nx; state.y = ny;
    if (isGoal(nx, ny)) events.push({ t: "atGoal" });
    if (isGrass(nx, ny) && state.flags.hasStarter) {
      // chance of a wild encounter when walking in tall grass
      if (nextRand(state) < 0.28) { startBattle(state, wildEncounter(state)); events.push({ t: "encounter" }); }
    }
    return;
  }
  if (input.type === "interact") {
    const [dx, dy] = DIRS[state.facing];
    if (isProfessor(state.x + dx, state.y + dy)) {
      if (!state.flags.hasStarter) {
        openDialog(state,
          ["PROF: Welcome! Pick a partner to begin your quest.",
           "(Choose your starter!)"],
          { kind: "chooseStarter" });
      } else {
        openDialog(state, ["PROF: Find tall grass and win a battle. Answer well!"], null);
      }
    }
    return;
  }
}

function stepDialog(state, input, events) {
  const d = state.dialog;
  // a starter-choice dialog waits for {type:'starter',index}
  if (d.effect && d.effect.kind === "chooseStarter") {
    if (input.type === "starter") {
      const sp = STARTERS[input.index % STARTERS.length];
      state.party = [makeMon(state, sp, 5)];
      state.flags.hasStarter = true;
      events.push({ t: "gotStarter", species: sp });
      state.mode = "overworld"; state.dialog = null;
    }
    return; // ignore other inputs until a starter is chosen
  }
  if (input.type === "confirm" || input.type === "interact") {
    d.idx++;
    if (d.idx >= d.lines.length) { state.mode = "overworld"; state.dialog = null; }
  }
}

function stepBattle(state, input, events) {
  const b = state.battle;
  if (b.phase === "intro") { if (input.type === "confirm" || input.type === "interact") b.phase = "menu"; return; }
  if (b.phase === "done") { if (input.type === "confirm" || input.type === "interact") endBattle(state); return; }
  if (b.phase === "menu") {
    if (input.type === "run") { // kid-friendly: fleeing always works
      b.result = "flee"; b.phase = "done"; b.log.push("Got away safely!");
      // fleeing isn't a loss; close immediately on next confirm
      return;
    }
    if (input.type === "fight") {
      // use the active mon's strongest-typed move (slice keeps move-choice simple)
      const me = activeMon(state);
      b.pendingMove = me.moves[me.moves.length - 1];
      b.asked = pickQuestion(state);
      b.phase = "quiz";
      events.push({ t: "ask", q: b.asked.text });
    }
    return;
  }
  if (b.phase === "quiz") {
    if (input.type !== "answer") return;
    const ok = checkAnswer(b.asked, input.index);
    b.asked.attempts++;
    const me = activeMon(state);
    if (ok) {
      const mv = MOVES[b.pendingMove];
      const mult = typeMult(mv.type, b.enemy.type);
      const dmg = dealDamage(me, b.enemy, mv, mult);
      b.log.push(`${me.name} used ${mv.name}! (-${dmg})`);
      if (b.asked.attempts === 1) { state.quiz.missRun = 0; } // first-try mastery
      events.push({ t: "answer", correct: true });
      // enemy retaliates if still standing, then resolve
      if (b.enemy.hp > 0) enemyTurn(state);
      b.asked = null; b.phase = "resolve"; afterTurns(state, events);
    } else {
      events.push({ t: "answer", correct: false });
      if (b.asked.attempts < 2) {
        b.log.push(`Not quite -- hint: ${b.asked.hint}. Try again!`);
        // gentle: a hint + one retry, no turn lost yet
      } else {
        // second miss: the move misses, enemy attacks, difficulty eases
        state.quiz.streak = 0; state.quiz.missRun++;
        b.log.push(`The move missed! (answer was ${b.asked.correctText})`);
        enemyTurn(state);
        b.asked = null; b.phase = "resolve"; afterTurns(state, events);
      }
    }
    return;
  }
}

// ---- what inputs are valid right now (drives the harness + soft-lock check) -
function availableInputs(state) {
  if (state.mode === "overworld") {
    const ins = [{ type: "interact" }];
    for (const dir of ["up", "down", "left", "right"]) ins.push({ type: "move", dir });
    return ins;
  }
  if (state.mode === "dialog") {
    if (state.dialog.effect && state.dialog.effect.kind === "chooseStarter")
      return STARTERS.map((_, i) => ({ type: "starter", index: i }));
    return [{ type: "confirm" }];
  }
  if (state.mode === "battle") {
    const b = state.battle;
    if (b.phase === "intro" || b.phase === "done") return [{ type: "confirm" }];
    if (b.phase === "menu") return [{ type: "fight" }, { type: "run" }];
    if (b.phase === "quiz") return b.asked.options.map((_, i) => ({ type: "answer", index: i }));
  }
  return [{ type: "confirm" }];
}

// ---- save / load with integrity --------------------------------------------
function saveGame(state) {
  const json = JSON.stringify(state);
  let sum = 0; for (let i = 0; i < json.length; i++) sum = (sum * 31 + json.charCodeAt(i)) >>> 0;
  return JSON.stringify({ v: 2, sum, data: json });
}
function loadGame(str, fallbackSeed) {
  try {
    const wrap = JSON.parse(str);
    if (!wrap || wrap.v !== 2 || typeof wrap.data !== "string") throw 0;
    let sum = 0; for (let i = 0; i < wrap.data.length; i++) sum = (sum * 31 + wrap.data.charCodeAt(i)) >>> 0;
    if (sum !== wrap.sum) throw 0;            // corrupt -> start fresh
    const s = JSON.parse(wrap.data);
    if (!s || typeof s.x !== "number" || !Array.isArray(s.party)) throw 0;
    return s;
  } catch (e) {
    return newGame(fallbackSeed || 1);        // never crash on a bad save
  }
}


/* ===== web/main.js ===== */
// =============================================================================
// Quiz Quest v2 -- BROWSER FRONT-END (rendering + input + read-aloud).
// Contains NO game rules: it only draws the GameState the logic core produces
// and forwards the child's input into step(). Full colour, scalable, touch +
// keyboard, with read-aloud for early readers.
// =============================================================================


const SAVE_KEY = "quizquest_v2_save";
const TILE = 40;                       // logical px per tile (canvas is scaled)
let state, ui = {}, lastQuizText = "", readAloud = true;

// ---------- boot -------------------------------------------------------------
function boot() {
  buildDom();
  // restore a save if present, else a fresh game seeded from the clock
  let saved = null; try { saved = localStorage.getItem(SAVE_KEY); } catch (e) {}
  state = saved ? loadGame(saved, (Date.now() >>> 0) || 1) : newGame((Date.now() >>> 0) || 1);
  bindKeys();
  requestAnimationFrame(loop);
  syncUi();
}

function persist() { try { localStorage.setItem(SAVE_KEY, saveGame(state)); } catch (e) {} }

// drive one input through the core, then refresh UI + save
function send(input) {
  try { step(state, input); } catch (e) { /* global guard also catches */ console.error(e); }
  persist();
  syncUi();
}

// ---------- DOM scaffold -----------------------------------------------------
function buildDom() {
  document.body.innerHTML =
    '<div id="qq">' +
    '  <div id="topbar"><span class="logo">⭐ Quiz Quest</span>' +
    '    <span class="grow"></span>' +
    '    <button id="btnRead" class="tb">🔊 Read aloud</button>' +
    '    <button id="btnReset" class="tb" title="Start over">↻</button></div>' +
    '  <div id="stage"><canvas id="cv" width="400" height="400"></canvas>' +
    '    <div id="overlay"></div></div>' +
    '  <div id="pad"></div>' +
    '</div>';
  ui.cv = document.getElementById("cv");
  ui.ctx = ui.cv.getContext("2d");
  ui.ctx.imageSmoothingEnabled = false;
  ui.overlay = document.getElementById("overlay");
  ui.pad = document.getElementById("pad");
  document.getElementById("btnRead").onclick = (e) => {
    readAloud = !readAloud; e.target.classList.toggle("off", !readAloud);
    if (!readAloud) stopSpeak();
  };
  document.getElementById("btnReset").onclick = () => {
    if (confirm("Start a new adventure? (your progress will reset)")) { state = newGame((Date.now() >>> 0) || 1); persist(); syncUi(); }
  };
  buildPad();
}

// on-screen controls for touch devices
function buildPad() {
  ui.pad.innerHTML =
    '<div class="dpad">' +
    '<button data-mv="up" class="d u">▲</button>' +
    '<button data-mv="left" class="d l">◀</button>' +
    '<button data-mv="right" class="d r">▶</button>' +
    '<button data-mv="down" class="d dn">▼</button></div>' +
    '<div class="ab"><button id="btnA" class="rb">A</button><button id="btnB" class="rb b">B</button></div>';
  ui.pad.querySelectorAll("[data-mv]").forEach(b =>
    b.addEventListener("click", () => onDir(b.getAttribute("data-mv"))));
  document.getElementById("btnA").onclick = () => onA();
  document.getElementById("btnB").onclick = () => onB();
}

// ---------- input ------------------------------------------------------------
function onDir(dir) { if (state.mode === "overworld") send({ type: "move", dir }); }
function onA() {
  if (state.mode === "overworld") send({ type: "interact" });
  else if (state.mode === "dialog") send({ type: "confirm" });
  else if (state.mode === "battle") {
    const b = state.battle;
    if (b.phase === "intro" || b.phase === "done") send({ type: "confirm" });
    else if (b.phase === "menu") send({ type: "fight" });
  }
}
function onB() {
  if (state.mode === "battle" && state.battle.phase === "menu") send({ type: "run" });
  else if (state.mode === "dialog") send({ type: "confirm" });
}
function bindKeys() {
  window.addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if (["arrowup", "w"].includes(k)) { onDir("up"); e.preventDefault(); }
    else if (["arrowdown", "s"].includes(k)) { onDir("down"); e.preventDefault(); }
    else if (["arrowleft", "a"].includes(k)) { onDir("left"); e.preventDefault(); }
    else if (["arrowright", "d"].includes(k)) { onDir("right"); e.preventDefault(); }
    else if (["z", "enter", " "].includes(k)) { onA(); e.preventDefault(); }
    else if (["x", "backspace"].includes(k)) { onB(); e.preventDefault(); }
    else if (state.mode === "battle" && state.battle.phase === "quiz" && /^[1-6]$/.test(k)) {
      const i = +k - 1; if (i < state.battle.asked.options.length) send({ type: "answer", index: i });
    }
  });
}

// ---------- render loop ------------------------------------------------------
function loop() { draw(); requestAnimationFrame(loop); }

const TILECOL = { "#": "#2f5d3a", ".": "#cde4b0", ",": "#7fc05a", "~": "#4aa6e0", "H": "#caa472", "P": "#cde4b0", "G": "#cde4b0", "S": "#cde4b0" };
function draw() {
  const ctx = ui.ctx;
  if (state.mode === "battle") { drawBattle(ctx); return; }
  // overworld
  for (let y = 0; y < MAP.h; y++) for (let x = 0; x < MAP.w; x++) {
    const t = MAP.rows[y][x];
    ctx.fillStyle = TILECOL[t] || "#cde4b0";
    ctx.fillRect(x * TILE, y * TILE, TILE, TILE);
    if (t === ",") { ctx.fillStyle = "#6aa748"; for (let i = 0; i < 3; i++) ctx.fillRect(x * TILE + 6 + i * 11, y * TILE + 24, 4, 12); }
    if (t === "#") { ctx.fillStyle = "#234a2c"; ctx.fillRect(x * TILE + 6, y * TILE + 6, TILE - 12, TILE - 12); ctx.fillStyle = "#3a6e44"; ctx.beginPath(); ctx.arc(x * TILE + TILE / 2, y * TILE + 16, 13, 0, 7); ctx.fill(); }
    if (t === "H") { ctx.fillStyle = "#9b2d2d"; ctx.fillRect(x * TILE + 4, y * TILE + 2, TILE - 8, 12); ctx.fillStyle = "#3a2a22"; ctx.fillRect(x * TILE + TILE / 2 - 5, y * TILE + 20, 10, TILE - 22); }
    if (t === "G") { ctx.fillStyle = "#7a4d00"; ctx.fillRect(x * TILE + TILE / 2 - 2, y * TILE + 16, 4, 18); ctx.fillStyle = "#ffd23f"; ctx.fillRect(x * TILE + 8, y * TILE + 6, TILE - 16, 14); ctx.fillStyle = "#5a4410"; ctx.font = "9px sans-serif"; ctx.fillText("GOAL", x * TILE + 9, y * TILE + 16); }
    if (t === "P") drawPerson(ctx, x * TILE, y * TILE, "#6d28d9", "#f4d9b0");
  }
  drawPerson(ctx, state.x * TILE, state.y * TILE, "#2563eb", "#f4d9b0", state.facing);
}
function drawPerson(ctx, px, py, body, skin, facing) {
  ctx.fillStyle = body; ctx.fillRect(px + 12, py + 16, 16, 16);
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(px + 20, py + 12, 8, 0, 7); ctx.fill();
  ctx.fillStyle = "#222";
  if (facing === "left") ctx.fillRect(px + 14, py + 11, 2, 2);
  else if (facing === "right") ctx.fillRect(px + 24, py + 11, 2, 2);
  else { ctx.fillRect(px + 16, py + 11, 2, 2); ctx.fillRect(px + 22, py + 11, 2, 2); }
}
function drawCreature(ctx, cx, cy, size, color, flip) {
  ctx.save(); ctx.translate(cx, cy); if (flip) ctx.scale(-1, 1);
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(0, 0, size, 0, 7); ctx.fill();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(-size * 0.55, -size * 0.8, size * 0.35, 0, 7); ctx.arc(size * 0.55, -size * 0.8, size * 0.35, 0, 7); ctx.fill(); // ears
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(-size * 0.35, -size * 0.1, size * 0.22, 0, 7); ctx.arc(size * 0.35, -size * 0.1, size * 0.22, 0, 7); ctx.fill();
  ctx.fillStyle = "#222"; ctx.beginPath(); ctx.arc(-size * 0.32, -size * 0.08, size * 0.1, 0, 7); ctx.arc(size * 0.38, -size * 0.08, size * 0.1, 0, 7); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,.18)"; ctx.beginPath(); ctx.arc(0, size * 0.35, size * 0.28, 0, 7); ctx.fill();
  ctx.restore();
}
function drawBattle(ctx) {
  const b = state.battle, me = state.party.find(m => m.hp > 0) || state.party[0];
  const g = ctx.createLinearGradient(0, 0, 0, 400); g.addColorStop(0, "#bfe3ff"); g.addColorStop(1, "#dff3c8"); ctx.fillStyle = g; ctx.fillRect(0, 0, 400, 400);
  ctx.fillStyle = "#9ed06a"; ctx.beginPath(); ctx.ellipse(300, 150, 80, 22, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(110, 300, 95, 26, 0, 0, 7); ctx.fill();
  drawCreature(ctx, 300, 130, 34, SPECIES[b.enemy.species].color, false);
  if (me) drawCreature(ctx, 110, 280, 40, SPECIES[me.species].color, true);
  hpBar(ctx, 30, 30, b.enemy);
  if (me) hpBar(ctx, 220, 200, me);
}
function hpBar(ctx, x, y, mon) {
  ctx.fillStyle = "#fff"; ctx.fillRect(x, y, 150, 38); ctx.strokeStyle = "#456"; ctx.strokeRect(x, y, 150, 38);
  ctx.fillStyle = "#243"; ctx.font = "bold 13px sans-serif"; ctx.fillText(`${mon.name}  Lv${mon.level}`, x + 6, y + 15);
  ctx.fillStyle = "#ccc"; ctx.fillRect(x + 6, y + 22, 138, 8);
  const frac = Math.max(0, mon.hp / mon.maxHp);
  ctx.fillStyle = frac > 0.5 ? "#3fb96b" : frac > 0.2 ? "#f2b134" : "#ef6b62";
  ctx.fillRect(x + 6, y + 22, 138 * frac, 8);
}

// ---------- overlay (dialog / starter / battle menus / quiz) -----------------
function syncUi() {
  const o = ui.overlay; let html = "";
  if (state.mode === "dialog") {
    const d = state.dialog;
    if (d.effect && d.effect.kind === "chooseStarter") {
      html = '<div class="box"><p>' + esc(d.lines[0]) + '</p><div class="opts">' +
        STARTERS.map((s, i) => `<button class="opt" data-starter="${i}" style="border-color:${SPECIES[s].color}">${esc(SPECIES[s].name)}<small>${SPECIES[s].type}</small></button>`).join("") +
        '</div></div>';
    } else {
      html = '<div class="box"><p>' + esc(d.lines[d.idx]) + '</p><button class="opt next">OK ▶</button></div>';
    }
  } else if (state.mode === "battle") {
    const b = state.battle;
    if (b.phase === "intro") html = msgBox(`A wild ${b.enemy.name} appeared!`, "OK ▶");
    else if (b.phase === "done") html = msgBox(b.log[b.log.length - 1] || "", "OK ▶");
    else if (b.phase === "menu") html = '<div class="box"><p>What will you do?</p><div class="opts"><button class="opt" id="oFight">⚔ FIGHT</button><button class="opt" id="oRun">🏃 RUN</button></div></div>';
    else if (b.phase === "quiz") {
      const a = b.asked;
      const clk = a.clock ? ` <span class="clk">🕐 ${a.clock} o'clock</span>` : "";
      html = '<div class="box quiz"><p class="q">' + esc(a.text) + clk + '</p><div class="opts grid">' +
        a.options.map((op, i) => `<button class="opt ans" data-ans="${i}">${esc(op)}</button>`).join("") +
        '</div>' + (a.attempts > 0 ? '<p class="hint">💡 ' + esc(a.hint) + '</p>' : '') + '</div>';
    }
  }
  o.innerHTML = html;
  // wire overlay buttons
  o.querySelectorAll("[data-starter]").forEach(btn => btn.onclick = () => send({ type: "starter", index: +btn.getAttribute("data-starter") }));
  o.querySelectorAll("[data-ans]").forEach(btn => btn.onclick = () => send({ type: "answer", index: +btn.getAttribute("data-ans") }));
  const nx = o.querySelector(".next"); if (nx) nx.onclick = () => onA();
  const f = o.querySelector("#oFight"); if (f) f.onclick = () => send({ type: "fight" });
  const r = o.querySelector("#oRun"); if (r) r.onclick = () => send({ type: "run" });
  const mb = o.querySelector(".msgbtn"); if (mb) mb.onclick = () => onA();
  maybeSpeak();
}
function msgBox(text, btn) { return '<div class="box"><p>' + esc(text) + '</p><button class="opt msgbtn">' + btn + '</button></div>'; }
function esc(s) { return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

// ---------- read-aloud -------------------------------------------------------
function maybeSpeak() {
  if (!readAloud || state.mode !== "battle" || !state.battle || state.battle.phase !== "quiz") { lastQuizText = ""; return; }
  const a = state.battle.asked, key = a.text + "|" + a.attempts;
  if (key === lastQuizText) return; lastQuizText = key;
  const opts = a.options.join(", ");
  speak(a.text + ". The choices are: " + opts + (a.attempts > 0 ? ". Hint: " + a.hint : ""));
}
function speak(text) {
  try {
    const synth = window.speechSynthesis; if (!synth) return; synth.cancel();
    const u = new SpeechSynthesisUtterance(sanitize(text));
    u.rate = 0.95; u.pitch = 1.05; synth.speak(u);
  } catch (e) {}
}
function stopSpeak() { try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (e) {} }
function sanitize(t) { return t.replace(/[*_#~`]/g, "").replace(/\s+/g, " ").trim(); }

if (document.readyState !== "loading") boot(); else document.addEventListener("DOMContentLoaded", boot);

})();
</script>
